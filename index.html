<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOX FOLLOW - Admin Panel</title>
    <style>
        :root {
            --bg-color: #0F172A;
            --card-color: #1E293B;
            --border-color: #334155;
            --text-main: #FFFFFF;
            --text-sub: #94A3B8;
            --accent-pink: #FF5C7E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            letter-spacing: 1px;
            color: var(--accent-pink);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-card p {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent-pink);
        }

        /* Lists Table */
        .section-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .orders-list {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .order-row {
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-row:last-child {
            border-bottom: none;
        }

        .order-type {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-pink);
        }

        .order-url {
            font-size: 13px;
            color: var(--text-sub);
            max-width: 60%;
        }

        .btn-update {
            background-color: #334155;
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-update:hover {
            background-color: var(--accent-pink);
        }

        .btn-refresh {
            background-color: var(--accent-pink);
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SOX FOLLOW - Admin Panel</h1>

        <button class="btn-refresh" onclick="fetchStats()">🔄 Refresh Data</button>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Users</h3>
                <p id="totalUsers">0</p>
            </div>
            <div class="stat-card">
                <h3>Insta ID Pool</h3>
                <p id="totalFake">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Orders</h3>
                <p id="totalOrders">0</p>
            </div>
        </div>

        <!-- Orders list Section -->
        <h2 class="section-header">Live Orders Queue</h2>
        <div class="orders-list" id="ordersContainer">
            <p style="color: var(--text-sub); text-align: center;">Loading orders...</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://ig-services-rdeu.onrender.com/api';

        // 1. Fetch Stats from Node.js Database
        async function fetchStats() {
            try {
                // Fetch counts
                const resStats = await fetch(`${API_URL}/admin/stats`);
                const stats = await resStats.json();
                document.getElementById('totalUsers').innerText = stats.totalUsers;
                document.getElementById('totalFake').innerText = stats.totalFakeAccounts;
                document.getElementById('totalOrders').innerText = stats.totalOrders;

                // Fetch orders
                const resOrders = await fetch(`${API_URL}/admin/orders`);
                const orders = await resOrders.json();
                
                const container = document.getElementById('ordersContainer');
                if (orders.length === 0) {
                    container.innerHTML = `<p style="color: var(--text-sub); text-align: center;">No orders placed yet.</p>`;
                    return;
                }

                container.innerHTML = '';
                orders.forEach(ord => {
                    const row = document.createElement('div');
                    row.className = 'order-row';
                    row.innerHTML = `
                        <div>
                            <span class="order-type">${ord.type.toUpperCase()} (${ord.quantityRequested} Qty)</span>
                            <p class="order-url">${ord.targetUrl}</p>
                            <span style="font-size: 11px; color: #FBBF24;">Status: ${ord.status}</span>
                        </div>
                        <button class="btn-update" onclick="updateStatus('${ord._id}', '${ord.status}')">Update Status</button>
                    `;
                    container.appendChild(row);
                });

            } catch (err) {
                alert('Server connection error. Please ensure Render backend is running.');
            }
        }

        // 2. Update Order Status (Complete / Process Order)
        async function updateStatus(orderId, currentStatus) {
            const nextStatus = currentStatus === 'Pending' ? 'Completed' : 'Pending';
            try {
                const res = await fetch(`${API_URL}/admin/update-order-status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId, newStatus: nextStatus })
                });
                if (res.ok) {
                    alert('Order status updated successfully!');
                    fetchStats(); // Refresh dashboard
                }
            } catch (err) {
                alert('Failed to update order status');
            }
        }

        // Initial Load
        fetchStats();
    </script>
</body>
  </html>
